<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Islamic Quiz & Spin Wheel - Saif, Kaif, Huzaifa, Ali</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(-45deg, #ff0055, #ff9900, #33cc33, #0099ff, #9933ff, #ff00cc);
      --card-bg: rgba(15, 20, 35, 0.85);
      --accent: #00e5ff;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: rainbowBG 10s ease infinite;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    @keyframes rainbowBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Top Color Theme Selector */
    .top-bar {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      margin-bottom: 15px;
    }

    .top-bar h1 {
      font-size: 1.3rem;
      letter-spacing: 0.5px;
      color: #ffd700;
    }

    .color-palette {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-palette span {
      font-size: 0.85rem;
      font-weight: 600;
      margin-right: 4px;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .color-btn:hover, .color-btn.active {
      transform: scale(1.25);
      box-shadow: 0 0 10px #fff;
    }

    /* Main Grid Layout */
    .main-container {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      flex: 1;
      align-items: start;
    }

    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Quiz Section */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .active-player-banner {
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(229, 46, 113, 0.4);
    }

    .question-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 18px;
      border-left: 5px solid #ffd700;
    }

    .question-text {
      font-size: 1.25rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .option-btn.correct {
      background: #16a34a !important;
      border-color: #4ade80 !important;
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
    }

    .option-btn.wrong {
      background: #dc2626 !important;
      border-color: #f87171 !important;
    }

    .opt-label {
      background: rgba(0, 0, 0, 0.4);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .quiz-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .feedback-msg {
      font-size: 1.05rem;
      font-weight: bold;
      min-height: 24px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      color: white;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:hover {
      transform: scale(1.04);
      box-shadow: 0 5px 15px rgba(0, 114, 255, 0.5);
    }

    /* Right Panel: Wheel + Scoreboard */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .wheel-wrapper {
      position: relative;
      width: 270px;
      height: 270px;
      margin: 10px 0;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 28px solid #ffd700;
      z-index: 10;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.6));
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #fff;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    }

    .spin-btn {
      margin-top: 10px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: none;
      color: #fff;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5);
      transition: transform 0.2s;
    }

    .spin-btn:hover:not(:disabled) {
      transform: scale(1.06);
    }

    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Scoreboard */
    .scoreboard-title {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: #ffd700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reset-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .scores-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 2px solid transparent;
      transition: 0.3s;
      cursor: pointer;
    }

    .player-card.active {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.2);
      transform: scale(1.03);
    }

    .player-name {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .player-points {
      background: #ffd700;
      color: #000;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 1rem;
    }

    /* Footer */
    footer {
      text-align: center;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffd700;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- Top Header & 10 Color Options -->
  <div class="top-bar">
    <h1>🌙 Islamic Quiz & Spin Wheel (250 Sawaal)</h1>
    <div class="color-palette" id="colorPalette">
      <span>10 Colors:</span>
    </div>
  </div>

  <!-- Main Workspace -->
  <div class="main-container">
    
    <!-- Left: 250 Islamic Questions -->
    <div class="panel">
      <div class="quiz-header">
        <span class="badge" id="qCounter">Sawaal 1 / 250</span>
        <div class="active-player-banner" id="turnDisplay">Turn: Spin Wheel Karein!</div>
      </div>

      <div class="question-box">
        <div class="question-text" id="questionText">Loading Islamic Sawaal...</div>
      </div>

      <div class="options-grid" id="optionsContainer"></div>

      <div class="quiz-controls">
        <div class="feedback-msg" id="feedbackMsg"></div>
        <div style="display:flex; gap:10px;">
          <button class="btn-primary" onclick="prevQuestion()">⬅ Pichla</button>
          <button class="btn-primary" onclick="nextQuestion()">Agla Sawaal ➡</button>
        </div>
      </div>
    </div>

    <!-- Right: Spin Wheel & Scoreboard -->
    <div class="right-column">
      
      <!-- Spin Wheel -->
      <div class="panel wheel-container">
        <h3 style="color:#ffd700; margin-bottom:5px;">🎡 Spin Wheel (Naam Chunein)</h3>
        <div class="wheel-wrapper">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN KAREIN</button>
      </div>

      <!-- Scoreboard -->
      <div class="panel">
        <div class="scoreboard-title">
          <span>🏆 Points Board (Click to Select Player)</span>
          <button class="reset-btn" onclick="resetScores()">Reset Points</button>
        </div>
        <div class="scores-grid" id="scoresGrid"></div>
      </div>

    </div>
  </div>

  <!-- Bottom Footer -->
  <footer>
    wecome
  </footer>

  <script>
    // 1. 10 Color Themes (Default Rainbow Live Wallpaper + 9 Colors)
    const colorThemes = [
      { name: "Rainbow Live", bg: "linear-gradient(-45deg, #ff0055, #ff9900, #33cc33, #0099ff, #9933ff, #ff00cc)", card: "rgba(15, 20, 35, 0.85)", dot: "conic-gradient(red, yellow, lime, aqua, blue, magenta, red)" },
      { name: "Emerald Green", bg: "linear-gradient(-45deg, #064e3b, #10b981, #047857, #34d399)", card: "rgba(6, 40, 30, 0.88)", dot: "#10b981" },
      { name: "Royal Blue", bg: "linear-gradient(-45deg, #1e3a8a, #3b82f6, #1d4ed8, #60a5fa)", card: "rgba(15, 25, 60, 0.88)", dot: "#3b82f6" },
      { name: "Golden Sunset", bg: "linear-gradient(-45deg, #78350f, #f59e0b, #b45309, #fbbf24)", card: "rgba(45, 25, 5, 0.88)", dot: "#f59e0b" },
      { name: "Crimson Red", bg: "linear-gradient(-45deg, #7f1d1d, #ef4444, #b91c1c, #f87171)", card: "rgba(50, 10, 10, 0.88)", dot: "#ef4444" },
      { name: "Royal Purple", bg: "linear-gradient(-45deg, #4c1d95, #8b5cf6, #6d28d9, #a78bfa)", card: "rgba(30, 12, 65, 0.88)", dot: "#8b5cf6" },
      { name: "Ocean Teal", bg: "linear-gradient(-45deg, #134e4a, #14b8a6, #0f766e, #2dd4bf)", card: "rgba(10, 45, 42, 0.88)", dot: "#14b8a6" },
      { name: "Pink Rose", bg: "linear-gradient(-45deg, #831843, #ec4899, #be185d, #f472b6)", card: "rgba(55, 10, 30, 0.88)", dot: "#ec4899" },
      { name: "Midnight Dark", bg: "linear-gradient(-45deg, #090d16, #1f2937, #111827, #374151)", card: "rgba(10, 14, 24, 0.92)", dot: "#1f2937" },
      { name: "Deep Orange", bg: "linear-gradient(-45deg, #7c2d12, #f97316, #c2410c, #fb923c)", card: "rgba(50, 18, 5, 0.88)", dot: "#f97316" }
    ];

    const paletteDiv = document.getElementById("colorPalette");
    colorThemes.forEach((theme, idx) => {
      const btn = document.createElement("div");
      btn.className = "color-btn" + (idx === 0 ? " active" : "");
      btn.style.background = theme.dot;
      btn.title = theme.name;
      btn.onclick = () => {
        document.documentElement.style.setProperty("--bg-gradient", theme.bg);
        document.documentElement.style.setProperty("--card-bg", theme.card);
        document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };
      paletteDiv.appendChild(btn);
    });

    // 2. Players & Spin Wheel Setup
    const players = ["Saif", "Kaif", "Huzaifa", "Ali"];
    const wheelColors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b"];
    let scores = { Saif: 0, Kaif: 0, Huzaifa: 0, Ali: 0 };
    let currentPlayer = null;
    let currentRotation = 0;
    let isSpinning = false;

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    function drawWheel() {
      const numSegments = players.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSegments; i++) {
        const angle = i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = wheelColors[i];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.lineTo(centerX, centerY);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px Segoe UI";
        ctx.fillText(players[i], radius - 25, 8);
        ctx.restore();
      }
    }
    drawWheel();

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;

      const extraSpins = 5 * 360;
      const randomDeg = Math.floor(Math.random() * 360);
      currentRotation += extraSpins + randomDeg;

      canvas.style.transition = "transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;

        // Calculate winner based on top pointer (270 degrees)
        const normalizedDeg = currentRotation % 360;
        const pointerAngle = (360 - normalizedDeg + 270) % 360;
        const segmentAngle = 360 / players.length;
        const winnerIndex = Math.floor(pointerAngle / segmentAngle);

        selectPlayer(players[winnerIndex]);
      }, 4000);
    }

    function selectPlayer(name) {
      currentPlayer = name;
      document.getElementById("turnDisplay").innerText = `🎯 Turn: ${name}`;
      renderScores();
    }

    function renderScores() {
      const grid = document.getElementById("scoresGrid");
      grid.innerHTML = "";
      players.forEach(p => {
        const card = document.createElement("div");
        card.className = "player-card" + (currentPlayer === p ? " active" : "");
        card.onclick = () => selectPlayer(p);
        card.innerHTML = `
          <span class="player-name">${p}</span>
          <span class="player-points">${scores[p]} pts</span>
        `;
        grid.appendChild(card);
      });
    }
    renderScores();

    function resetScores() {
      players.forEach(p => scores[p] = 0);
      renderScores();
    }

    // 3. 250 Islamic Questions Bank
    const baseQuestions = [
      { q: "Islam ke kitne arkaan (pillars) hain?", o: ["3", "4", "5", "6"], a: 2 },
      { q: "Quran Majeed mein kul kitni Suratein hain?", o: ["110", "112", "114", "116"], a: 2 },
      { q: "Sabse pehle Nabi kaun the?", o: ["Hazrat Nooh (AS)", "Hazrat Adam (AS)", "Hazrat Ibrahim (AS)", "Hazrat Musa (AS)"], a: 1 },
      { q: "Aakhri Nabi kaun hain?", o: ["Hazrat Isa (AS)", "Hazrat Musa (AS)", "Hazrat Muhammad (SAW)", "Hazrat Dawood (AS)"], a: 2 },
      { q: "Quran Majeed kis mahine mein nazil hua?", o: ["Muharram", "Rajab", "Ramadan", "Shawwal"], a: 2 },
      { q: "Din mein kitni waqt ki namaz farz hai?", o: ["3", "4", "5", "6"], a: 2 },
      { q: "Quran ki sabse badi Surah kaunsi hai?", o: ["Surah Al-Fatiha", "Surah Al-Baqarah", "Surah Yaseen", "Surah Al-Ikhlas"], a: 1 },
      { q: "Quran ki sabse chhoti Surah kaunsi hai?", o: ["Surah Al-Kausar", "Surah Al-Asr", "Surah An-Nas", "Surah Al-Falaq"], a: 0 },
      { q: "Pehle Khalifa kaun the?", o: ["Hazrat Umar (RA)", "Hazrat Usman (RA)", "Hazrat Ali (RA)", "Hazrat Abu Bakr Siddiq (RA)"], a: 3 },
      { q: "Chauthe Khalifa kaun the?", o: ["Hazrat Ali (RA)", "Hazrat Umar (RA)", "Hazrat Abu Bakr (RA)", "Hazrat Usman (RA)"], a: 0 },
      { q: "Zakat kis par farz hai?", o: ["Har bacche par", "Sahib-e-Nisab par", "Sirf musafiron par", "Kisi par nahi"], a: 1 },
      { q: "Hajj kis mahine mein ada kiya jata hai?", o: ["Ramadan", "Muharram", "Zil-Hijjah", "Safar"], a: 2 },
      { q: "Wahi lane wale farishte ka naam kya hai?", o: ["Hazrat Mikael (AS)", "Hazrat Israfeel (AS)", "Hazrat Jibreel (AS)", "Hazrat Izraeel (AS)"], a: 2 },
      { q: "Huzoor (SAW) ki paidaish kis shehar mein hui?", o: ["Madina", "Makkah", "Taif", "Jerusalem"], a: 1 },
      { q: "Huzoor (SAW) ka rawza mubarak kahan hai?", o: ["Makkah", "Madina", "Baghdad", "Damascus"], a: 1 },
      { q: "Quran mein kitne Sipare (Para) hain?", o: ["20", "25", "30", "40"], a: 2 },
      { q: "Kis Surah ko Quran ka dil kaha jata hai?", o: ["Surah Rahman", "Surah Mulk", "Surah Yaseen", "Surah Kahf"], a: 2 },
      { q: "Asadullah (Allah ka Sher) kis Sahabi ka laqab hai?", o: ["Hazrat Umar (RA)", "Hazrat Ali (RA)", "Hazrat Hamza (RA)", "Hazrat Khalid (RA)"], a: 1 },
      { q: "Saifullah (Allah ki Talwar) kis Sahabi ko kaha jata hai?", o: ["Hazrat Khalid bin Walid (RA)", "Hazrat Ali (RA)", "Hazrat Bilal (RA)", "Hazrat Saad (RA)"], a: 0 },
      { q: "Islam ke pehle Muazzin kaun the?", o: ["Hazrat Zaid (RA)", "Hazrat Bilal Habshi (RA)", "Hazrat Salman (RA)", "Hazrat Abu Hurairah (RA)"], a: 1 },
      { q: "Ghazwa-e-Badr kab lada gaya?", o: ["1 Hijri", "2 Hijri", "3 Hijri", "5 Hijri"], a: 1 },
      { q: "Zabihullah kis Nabi ka laqab hai?", o: ["Hazrat Ishaq (AS)", "Hazrat Ismail (AS)", "Hazrat Yaqub (AS)", "Hazrat Yusuf (AS)"], a: 1 },
      { q: "Kaleemullah kis Nabi ko kaha jata hai?", o: ["Hazrat Musa (AS)", "Hazrat Isa (AS)", "Hazrat Ibrahim (AS)", "Hazrat Nooh (AS)"], a: 0 },
      { q: "Roohullah kis Nabi ka laqab hai?", o: ["Hazrat Adam (AS)", "Hazrat Isa (AS)", "Hazrat Yahya (AS)", "Hazrat Zakariya (AS)"], a: 1 },
      { q: "Khaleelullah kis Nabi ko kaha jata hai?", o: ["Hazrat Ibrahim (AS)", "Hazrat Loot (AS)", "Hazrat Hud (AS)", "Hazrat Saleh (AS)"], a: 0 },
      { q: "Hazrat Muhammad (SAW) ke walid ka naam kya tha?", o: ["Hazrat Abdul Muttalib", "Hazrat Abdullah", "Hazrat Abu Talib", "Hazrat Hamza"], a: 1 },
      { q: "Hazrat Muhammad (SAW) ki walida ka naam kya tha?", o: ["Hazrat Halima", "Hazrat Amina", "Hazrat Khadija", "Hazrat Fatima"], a: 1 },
      { q: "Islam ki pehli masjid kaunsi hai?", o: ["Masjid-e-Nabawi", "Masjid-e-Quba", "Masjid-al-Haram", "Masjid-al-Aqsa"], a: 1 },
      { q: "Qibla-e-Awwal kaunsi masjid thi?", o: ["Masjid-al-Haram", "Masjid-al-Aqsa", "Masjid-e-Quba", "Masjid-e-Nabawi"], a: 1 },
      { q: "Shab-e-Qadr kis mahine mein aati hai?", o: ["Shaban", "Ramadan", "Rajab", "Muharram"], a: 1 },
      { q: "Quran ki kis Surah mein Bismillah do martaba aayi hai?", o: ["Surah Taubah", "Surah Naml", "Surah Fatiha", "Surah Ikhlas"], a: 1 },
      { q: "Quran ki kis Surah ke shuru mein Bismillah nahi hai?", o: ["Surah Taubah", "Surah Anfal", "Surah Kahf", "Surah Maryam"], a: 0 },
      { q: "Zaboor kis Nabi par nazil hui?", o: ["Hazrat Musa (AS)", "Hazrat Dawood (AS)", "Hazrat Isa (AS)", "Hazrat Ibrahim (AS)"], a: 1 },
      { q: "Taurat kis Nabi par nazil hui?", o: ["Hazrat Musa (AS)", "Hazrat Isa (AS)", "Hazrat Dawood (AS)", "Hazrat Haroon (AS)"], a: 0 },
      { q: "Injeel kis Nabi par nazil hui?", o: ["Hazrat Musa (AS)", "Hazrat Isa (AS)", "Hazrat Yahya (AS)", "Hazrat Sulaiman (AS)"], a: 1 },
